name: hassfest

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**'
      - '!backlog/**'
      - '!docs/**/*.md'
      - 'backlog/config.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
