rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: done
    comment: |
      Brand assets in custom_components/2n_intercom/brand/ directory
      per the current custom-integration layout.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: done
    comment: |
      async_step_ssdp cross-references the device's MAC (from SSDP's
      serialNumber/UDN fields) against each configured entry's stored
      mac_address. On a match, if the host has changed, the entry is
      updated in place and reloaded — no user action needed when a 2N
      device's IP changes. Entries created before this existed have
      mac_address backfilled from /api/system/info on next setup.
  discovery:
    status: done
    comment: |
      2N devices advertise themselves over SSDP (manufacturer "2N, part of
      Axis group" — see manifest.json's ssdp matcher) with a description.xml
      exposing serialNumber/UDN (MAC-based), presentationURL, and
      friendlyName. async_step_ssdp in config_flow.py handles discovery,
      including Control4-rebranded units (DS2/DS2 Mini), which advertise
      under the same manufacturer with a Control4-branded friendlyName.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      One config entry maps to exactly one intercom device; there are no
      dynamically appearing sub-devices.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: |
      No persistent failure modes that require an actionable repair issue —
      authentication problems are surfaced through the reauth flow instead.
  stale-devices:
    status: exempt
    comment: |
      One config entry maps to exactly one device; the device is removed when
      the entry is removed.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: done
    comment: |
      mypy passes clean (strict, with HA core stubs).
      pyright passes clean with pyrightconfig.json suppressing
      HA-framework-level false positives (cached_property override,
      stub fallback typing) that affect all HA integrations equally.
